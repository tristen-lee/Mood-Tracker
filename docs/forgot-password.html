<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Cairn</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#31373E">
    <link rel="apple-touch-icon" href="assets/cairn-logo-512px.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="centered-layout">
    <div class="onboarding-card" style="margin-top: 4rem;">
        <img src="assets/cairn.svg" alt="Cairn" class="logo" style="margin-bottom: 1.5rem;">
        <h2 style="margin-bottom: 0.5rem;">Reset your password</h2>
        <p style="opacity: 0.6; margin-bottom: 1.5rem; font-size: 0.95rem;">Enter your email and we'll send you a reset link.</p>
        <form id="forgot-form">
            <input type="email" id="email-input" placeholder="Your email" required style="width: 100%; margin-bottom: 1rem;">
            <button class="onboarding-btn" type="submit" style="width: 100%;">Send reset link</button>
            <p class="auth-message" id="message" style="margin-top: 1rem;"></p>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; opacity: 0.5;"><a href="home.html">Back to log in</a></p>
    </div>
    <script>
        const API = "https://mood-tracker-11bv.onrender.com";
        document.getElementById("forgot-form").addEventListener("submit", async e => {
            e.preventDefault();
            const msg = document.getElementById("message");
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            btn.textContent = "Sending…";
            try {
                const res = await fetch(`${API}/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById("email-input").value }),
                });
                const data = await res.json();
                msg.textContent = data.message;
                msg.style.color = "var(--accent)";
                btn.textContent = "Sent";
            } catch {
                msg.textContent = "Something went wrong. Try again.";
                msg.style.color = "#e57373";
                btn.disabled = false;
                btn.textContent = "Send reset link";
            }
        });
    </script>
</body>
</html>
