<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Cairn</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#31373E">
    <link rel="apple-touch-icon" href="assets/cairn-logo-512px.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="centered-layout">
    <div class="onboarding-card" style="margin-top: 4rem;">
        <img src="assets/cairn.svg" alt="Cairn" class="logo" style="margin-bottom: 1.5rem;">
        <h2 style="margin-bottom: 0.5rem;">Choose a new password</h2>
        <p style="opacity: 0.6; margin-bottom: 1.5rem; font-size: 0.95rem;">Make it something you'll remember.</p>
        <form id="reset-form">
            <input type="password" id="password-input" placeholder="New password" required style="width: 100%; margin-bottom: 1rem;">
            <input type="password" id="confirm-input" placeholder="Confirm password" required style="width: 100%; margin-bottom: 1rem;">
            <button class="onboarding-btn" type="submit" style="width: 100%;">Set new password</button>
            <p class="auth-message" id="message" style="margin-top: 1rem;"></p>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; opacity: 0.5;"><a href="home.html">Back to log in</a></p>
    </div>
    <script>
        const API = "https://mood-tracker-11bv.onrender.com";
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.getElementById("message").textContent = "Invalid reset link.";
            document.getElementById("reset-form").style.display = "none";
        }

        document.getElementById("reset-form").addEventListener("submit", async e => {
            e.preventDefault();
            const msg = document.getElementById("message");
            const pw = document.getElementById("password-input").value;
            const confirm = document.getElementById("confirm-input").value;

            if (pw !== confirm) {
                msg.textContent = "Passwords don't match.";
                msg.style.color = "#e57373";
                return;
            }

            const btn = e.target.querySelector("button");
            btn.disabled = true;
            btn.textContent = "Saving…";

            try {
                const res = await fetch(`${API}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: pw }),
                });
                const data = await res.json();
                if (!res.ok) {
                    msg.textContent = data.detail || "Something went wrong.";
                    msg.style.color = "#e57373";
                    btn.disabled = false;
                    btn.textContent = "Set new password";
                } else {
                    msg.textContent = data.message + " Redirecting…";
                    msg.style.color = "var(--accent)";
                    document.getElementById("reset-form").style.display = "none";
                    setTimeout(() => { window.location.href = "home.html"; }, 2000);
                }
            } catch {
                msg.textContent = "Something went wrong. Try again.";
                msg.style.color = "#e57373";
                btn.disabled = false;
                btn.textContent = "Set new password";
            }
        });
    </script>
</body>
</html>
